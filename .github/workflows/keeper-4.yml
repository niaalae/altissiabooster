name: session-keeper-4

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

env:
  KEEPER_CONFIG: session-keeper/instances/config-4.json

jobs:
  keep-alive-1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Restore cookies from secret
        run: echo "${{ secrets.COOKIES_B64 }}" | base64 -d > session-keeper/cookies-v0-app.txt
      - name: Run session keeper (segment 1/4)
        run: bash session-keeper/setup_and_run.sh
      - name: Refresh cookie secret for next segment
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: bash upload_cookies.sh
  keep-alive-2:
    needs: keep-alive-1
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Restore cookies from secret
        run: echo "${{ secrets.COOKIES_B64 }}" | base64 -d > session-keeper/cookies-v0-app.txt
      - name: Run session keeper (segment 2/4)
        run: bash session-keeper/setup_and_run.sh
      - name: Refresh cookie secret for next segment
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: bash upload_cookies.sh
  keep-alive-3:
    needs: keep-alive-2
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Restore cookies from secret
        run: echo "${{ secrets.COOKIES_B64 }}" | base64 -d > session-keeper/cookies-v0-app.txt
      - name: Run session keeper (segment 3/4)
        run: bash session-keeper/setup_and_run.sh
      - name: Refresh cookie secret for next segment
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: bash upload_cookies.sh
  keep-alive-4:
    needs: keep-alive-3
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Restore cookies from secret
        run: echo "${{ secrets.COOKIES_B64 }}" | base64 -d > session-keeper/cookies-v0-app.txt
      - name: Run session keeper (segment 4/4)
        run: bash session-keeper/setup_and_run.sh
      - name: Refresh cookie secret for next segment
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: bash upload_cookies.sh
