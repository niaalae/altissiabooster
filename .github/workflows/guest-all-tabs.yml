name: guest-all-tabs

on:
  workflow_dispatch:

jobs:
  sandbox-1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Run keeper (guest tabs, no cookies)
        env:
          KEEPER_CONFIG: instances/guest-all/sandbox-1.json
        run: bash session-keeper/setup_and_run.sh
