name: dump-acc1-cookies
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump secret to artifact
        run: |
          echo "${{ secrets.COOKIES_B64 }}" | base64 -d > cookies-v0-app.txt
          mkdir -p artifact
          cp cookies-v0-app.txt artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: acc1-cookies
          path: artifact/
